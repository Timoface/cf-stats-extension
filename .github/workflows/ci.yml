name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit, manifest and API tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Build extension packages
        run: npm run build
